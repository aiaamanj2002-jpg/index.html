<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nature Login</title>
    <meta
      name="description"
      content="Nature themed login landing page with a full background image and soft glass style navigation."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand" aria-label="Brand logo">
          <div class="logo-mark">◌</div>
          <span>LOGO</span>
        </div>

        <nav class="nav" aria-label="Main navigation">
          <a href="#">HOME</a>
          <a href="#">BLOG</a>
          <a href="#">FAQ</a>
          <a href="#">ABOUT US</a>
        </nav>

        <div class="search-wrap" aria-label="Search">
          <input type="text" placeholder="" aria-label="Search field" />
          <button type="button" aria-label="Search button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="5.5"></circle>
              <path d="M16 16L21 21"></path>
            </svg>
          </button>
        </div>
      </header>

      <main class="hero">
        <div class="orb" aria-hidden="true"></div>

        <div class="content">
          <h1>
            LET THE NATURE
            <span>set you free</span>
          </h1>

          <p>
            Lorem ipsum dolor sit amet, consectetuer adipiscing elit, sed diam nonummy nibh euismod
            tincidunt ut laoreet dolore magna aliquam erat volutpat.
          </p>

          <button class="cta" type="button">MORE INFO</button>
        </div>

        <div class="sea-scene" aria-hidden="true">
          <div class="bubble bubble-1"></div>
          <div class="bubble bubble-2"></div>
          <div class="bubble bubble-3"></div>
          <div class="bubble bubble-4"></div>
          <div class="bubble bubble-5"></div>
          <div class="bubble bubble-6"></div>
          <div class="fish fish-1"></div>
          <div class="fish fish-2"></div>
          <div class="fish fish-3"></div>
          <div class="fish fish-4"></div>
          <div class="plant plant-1"></div>
          <div class="plant plant-2"></div>
          <div class="plant plant-3"></div>
          <div class="plant plant-4"></div>
        </div>
      </main>

      <aside class="socials" aria-label="Social links">
        <a href="#" aria-label="Instagram">◎</a>
        <a href="#" aria-label="Facebook">◌</a>
        <a href="#" aria-label="X">✕</a>
      </aside>

      <div class="credit">designed by <span>freepik</span></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
